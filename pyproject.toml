[project]
name = "slither-royale"
version = "0.1.0"
description = "Moteur de jeu et serveur pour Slither Royale"
requires-python = ">=3.12"
authors = [
    { name = "Jonathan Heilmann"},
    { name = "Alexandre Vial"},
    { name = "Allan Amri"},
]
license = { file = "LICENSE" }
dependencies = ["numpy>=2.0", "Django>=6.1.2", "psycopg[binary]>=3.3.6", "python-dotenv>=1.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "server", "accounts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
