<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Créer un compte</title>
</head>
<body>
    <h1>Créer un compte</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">S’inscrire</button>
    </form>

    <p><a href="{% url 'login' %}">Déjà un compte ? Se connecter</a></p>
</body>
</html>
